name: Publish release to JFrog

on:
  release:
    types: [published]
  push:
    branches: [master]
    paths:
      - '.github/release-version'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example 5.1.3 or v5.1.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Maven artifacts
    runs-on: ubuntu-latest
    env:
      JFROG_URL: ${{ vars.JFROG_URL }}
      JFROG_REPOSITORY: ${{ vars.JFROG_REPOSITORY }}
      JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
      JFROG_ACCESS_TOKEN: ${{ secrets.JFROG_ACCESS_TOKEN }}
      EVENT_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.release.tag_name || inputs.tag }}

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$(tr -d '[:space:]' < .github/release-version)"
          else
            tag="$EVENT_RELEASE_TAG"
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unsupported release tag '$tag'. Expected 1.2.3 or v1.2.3 (pre-release suffixes are allowed)."
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Publishing version $version from $tag"

      - name: Validate JFrog configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in JFROG_URL JFROG_REPOSITORY JFROG_USERNAME JFROG_ACCESS_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub configuration for $name. See JFROG.md."
              exit 1
            fi
          done

      - name: Build, test, sources and Javadocs
        shell: bash
        run: |
          ./gradlew clean test jar sourcesJar javadocJar -PreleaseVersion="$RELEASE_VERSION"

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            "build/libs/web-push-${RELEASE_VERSION}.jar" \
            "build/libs/web-push-${RELEASE_VERSION}-sources.jar" \
            "build/libs/web-push-${RELEASE_VERSION}-javadoc.jar"; do
            test -f "$file" || { echo "::error::Expected artifact not found: $file"; exit 1; }
          done

      - name: Publish Maven publication to JFrog Artifactory
        shell: bash
        run: |
          ./gradlew -Pjfrog -PreleaseVersion="$RELEASE_VERSION" publishMavenJavaPublicationToJfrogRepository

      - name: Store workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-push-${{ env.RELEASE_TAG }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Ensure GitHub Release exists
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; reusing it."
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "web-push $RELEASE_VERSION" \
              --generate-notes
          fi

      - name: Attach JARs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "build/libs/web-push-${RELEASE_VERSION}.jar" \
              "build/libs/web-push-${RELEASE_VERSION}-sources.jar" \
              "build/libs/web-push-${RELEASE_VERSION}-javadoc.jar" \
              --clobber
          else
            echo "No GitHub Release exists for $RELEASE_TAG; JFrog publication completed without release attachments."
          fi
