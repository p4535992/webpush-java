name: Publish release to JFrog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example 5.1.3 or v5.1.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Maven artifacts
    runs-on: ubuntu-latest
    env:
      JFROG_URL: ${{ vars.JFROG_URL }}
      JFROG_REPOSITORY: ${{ vars.JFROG_REPOSITORY }}
      JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
      JFROG_ACCESS_TOKEN: ${{ secrets.JFROG_ACCESS_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unsupported release tag '$RELEASE_TAG'. Expected 1.2.3 or v1.2.3 (pre-release suffixes are allowed)."
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Publishing version $version from tag $RELEASE_TAG"

      - name: Validate JFrog configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in JFROG_URL JFROG_REPOSITORY JFROG_USERNAME JFROG_ACCESS_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub configuration for $name. See JFROG.md."
              exit 1
            fi
          done

      - name: Build, test, sources and Javadocs
        shell: bash
        run: |
          ./gradlew clean test jar sourcesJar javadocJar -PreleaseVersion="$RELEASE_VERSION"

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            "build/libs/web-push-${RELEASE_VERSION}.jar" \
            "build/libs/web-push-${RELEASE_VERSION}-sources.jar" \
            "build/libs/web-push-${RELEASE_VERSION}-javadoc.jar"; do
            test -f "$file" || { echo "::error::Expected artifact not found: $file"; exit 1; }
          done

      - name: Publish Maven publication to JFrog Artifactory
        shell: bash
        run: |
          ./gradlew -Pjfrog -PreleaseVersion="$RELEASE_VERSION" publishMavenJavaPublicationToJfrogRepository

      - name: Store workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-push-${{ env.RELEASE_VERSION }}
          path: |
            build/libs/web-push-${{ env.RELEASE_VERSION }}.jar
            build/libs/web-push-${{ env.RELEASE_VERSION }}-sources.jar
            build/libs/web-push-${{ env.RELEASE_VERSION }}-javadoc.jar
          if-no-files-found: error

      - name: Attach JARs to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            "build/libs/web-push-${RELEASE_VERSION}.jar" \
            "build/libs/web-push-${RELEASE_VERSION}-sources.jar" \
            "build/libs/web-push-${RELEASE_VERSION}-javadoc.jar" \
            --clobber
